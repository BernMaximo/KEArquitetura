<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <!-- Circular Badge -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="50" fill="#686B6E"/>
    <!-- K Element (Cyan/Aqua) -->
    <!-- Left vertical bar of K (top and bottom separated by floor plan slit) -->
    <rect x="26" y="20" width="7" height="28" rx="1" fill="#7EE7E2"/>
    <rect x="26" y="52" width="7" height="28" rx="1" fill="#7EE7E2"/>
    
    <!-- Middle vertical leg of K -->
    <rect x="39" y="20" width="7" height="28" rx="1" fill="#7EE7E2"/>
    <rect x="39" y="52" width="7" height="28" rx="1" fill="#7EE7E2"/>
    
    <!-- Horizontal connection of K -->
    <rect x="26" y="44" width="20" height="4" fill="#7EE7E2"/>
    
    <!-- E Element (Crisp Pure White) -->
    <!-- Top arm -->
    <rect x="52" y="20" width="22" height="7" rx="1" fill="#FFFFFF"/>
    <!-- Stem top -->
    <rect x="52" y="20" width="7" height="28" rx="1" fill="#FFFFFF"/>
    <!-- Stem bottom -->
    <rect x="52" y="52" width="7" height="28" rx="1" fill="#FFFFFF"/>
    <!-- Bottom arm -->
    <rect x="52" y="73" width="22" height="7" rx="1" fill="#FFFFFF"/>
  </g>

  <!-- Typography Brand Lockup -->
  <text x="130" y="55" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', sans-serif" font-size="28" font-weight="700" letter-spacing="0.08em" fill="#1A1A1A">
    K<tspan fill="#7EE7E2">+</tspan>E
  </text>
  <text x="130" y="80" font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', sans-serif" font-size="11" font-weight="600" letter-spacing="0.28em" fill="#686B6E">
    ARQUITETURA &amp; INTERIORES
  </text>
</svg>

